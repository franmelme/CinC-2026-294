<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive latent spaces</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

  <style>
    :root {
      --background: #f5f2eb;
      --panel: #ffffff;
      --primary: #722f37;
      --secondary: #1f5964;
      --text: #202124;
      --muted: #64748b;
      --border: #cbd5e1;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      padding: 14px;
      background: var(--background);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    header {
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 5px;
      color: var(--primary);
      font-size: 1.35rem;
    }

    header p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .panel {
      margin-bottom: 12px;
      padding: 12px;
      background: var(--panel);
      border-radius: 14px;
      box-shadow: 0 3px 14px rgba(0,0,0,0.08);
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 10px;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 5px;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: bold;
    }

    select, input, button {
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: white;
      font-size: 0.95rem;
    }

    button {
      border: none;
      background: var(--primary);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: var(--secondary);
    }

    #graph {
      width: 100%;
      height: 65vh;
      min-height: 450px;
    }

    #information {
      min-height: 55px;
      margin-top: 8px;
      line-height: 1.5;
    }

    .help {
      color: var(--muted);
      font-size: 0.88rem;
    }

    .status {
      margin-top: 8px;
      color: var(--secondary);
      font-size: 0.82rem;
    }

    @media (min-width: 850px) {
      body {
        max-width: 1100px;
        margin: auto;
      }

      .controls {
        grid-template-columns: repeat(4, minmax(0,1fr));
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Interactive latent spaces</h1>
    <p>
      Select a representation, filter the groups, rotate the latent space and inspect individual observations.
    </p>
  </header>

  <section class="panel controls">
    <label>
      Latent space
      <select id="spaceSelector"></select>
    </label>

    <label>
      Group
      <select id="groupSelector"></select>
    </label>

    <label>
      Marker size
      <input id="markerSize" type="range" min="2" max="12" value="5">
    </label>

    <button id="resetButton">
      Reset view
    </button>
  </section>

  <section class="panel">
    <div id="graph"></div>
    <div id="status" class="status"></div>
  </section>

  <section class="panel">
    <strong>Selected observation</strong>
    <div id="information">
      <span class="help">
        Select a point to inspect its coordinates and group.
      </span>
    </div>
  </section>

    const palette = [
      "#722f37",
      "#1f5964",
      "#7b8f75",
      "#b66a3c",
      "#d3715b",
      "#d2a33c",
      "#2e7d7a",
      "#954535",
      "#6c5b7b",
      "#3f6f4f"
    ];

    const ALL_GROUPS = "__ALL_GROUPS__";

    const spaceSelector =
      document.getElementById("spaceSelector");

    const groupSelector =
      document.getElementById("groupSelector");

    const markerSize =
      document.getElementById("markerSize");

    const graph =
      document.getElementById("graph");

    const information =
      document.getElementById("information");

    const status =
      document.getElementById("status");

    let currentCamera = null;

    function normalizeLabel(value) {
      return String(value).trim();
    }

    function uniqueValues(vector) {
      return [...new Set(
        vector.map(normalizeLabel)
      )];
    }

    const normalizedLabels =
      data.etiquetas.map(normalizeLabel);

    const groups = uniqueValues(normalizedLabels);

    function prepareSelectors() {
      spaceSelector.innerHTML = "";
      groupSelector.innerHTML = "";

      data.nombres.forEach((name, index) => {
        const option = document.createElement("option");
        option.value = String(index);
        option.textContent = name;
        spaceSelector.appendChild(option);
      });

      const allOption = document.createElement("option");
      allOption.value = ALL_GROUPS;
      allOption.textContent = "All groups";
      groupSelector.appendChild(allOption);

      groups.forEach(group => {
        const option = document.createElement("option");
        option.value = group;
        option.textContent = "Group " + group;
        groupSelector.appendChild(option);
      });

      spaceSelector.value = "0";
      groupSelector.value = ALL_GROUPS;
    }

    function indicesForGroup(group) {
      const indices = [];

      normalizedLabels.forEach((label, index) => {
        if (label === group) {
          indices.push(index);
        }
      });

      return indices;
    }

    function createTraces() {
      const spaceIndex = Number(spaceSelector.value);
      const space = data.espacios[spaceIndex];
      const selectedGroup =
        normalizeLabel(groupSelector.value);
      const size = Number(markerSize.value);

      const traces = [];

      groups.forEach((group, groupIndex) => {
        if (
          selectedGroup !== ALL_GROUPS &&
          selectedGroup !== group
        ) {
          return;
        }

        const indices = indicesForGroup(group);

        if (indices.length === 0) {
          return;
        }

        traces.push({
          type: "scatter3d",
          mode: "markers",
          name: "Group " + group,

          x: indices.map(index => space.x[index]),
          y: indices.map(index => space.y[index]),
          z: indices.map(index => space.z[index]),

          customdata: indices.map(index => [
            data.indices[index],
            data.identificadores[index],
            normalizedLabels[index]
          ]),

          marker: {
            size: size,
            color: palette[groupIndex % palette.length],
            opacity: 0.85,
            line: {
              color: "#ffffff",
              width: 0.5
            }
          },

          hovertemplate: [
            "<b>%{customdata[1]}</b><br>",
            "Group: %{customdata[2]}<br>",
            "Dimension 1: %{x:.3f}<br>",
            "Dimension 2: %{y:.3f}<br>",
            "Dimension 3: %{z:.3f}",
            "<extra></extra>"
          ].join("")
        });
      });

      return traces;
    }

    function updateGraph() {
      const spaceIndex = Number(spaceSelector.value);
      const spaceName = data.nombres[spaceIndex];
      const traces = createTraces();

      const layout = {
        title: {
          text: spaceName,
          x: 0.5
        },

        margin: {
          l: 0,
          r: 0,
          b: 0,
          t: 50
        },

        legend: {
          orientation: "h",
          x: 0,
          y: 1.02
        },

        uirevision: "latent-space-viewer",

        scene: {
          aspectmode: "data",
          xaxis: {title: "Dimension 1"},
          yaxis: {title: "Dimension 2"},
          zaxis: {title: "Dimension 3"}
        }
      };

      if (currentCamera !== null) {
        layout.scene.camera = currentCamera;
      }

      Plotly.react(
        graph,
        traces,
        layout,
        {
          responsive: true,
          displaylogo: false,
          scrollZoom: true
        }
      ).then(() => {
        const visiblePoints = traces.reduce(
          (total, trace) => total + trace.x.length,
          0
        );

        status.textContent =
          groups.length + " groups detected. " +
          traces.length + " groups displayed. " +
          visiblePoints + " points displayed.";
      });
    }

    prepareSelectors();
    updateGraph();

    graph.on("plotly_relayout", event => {
      if (event["scene.camera"]) {
        currentCamera = event["scene.camera"];
      }
    });

    graph.on("plotly_click", event => {
      if (!event.points || event.points.length === 0) {
        return;
      }

      const point = event.points[0];
      const metadata = point.customdata;

      information.innerHTML =
        "<p>" +
        "<strong>Observation:</strong> " +
        metadata[1] + "<br>" +
        "<strong>Index:</strong> " +
        metadata[0] + "<br>" +
        "<strong>Group:</strong> " +
        metadata[2] + "<br>" +
        "<strong>Dimension 1:</strong> " +
        Number(point.x).toFixed(4) + "<br>" +
        "<strong>Dimension 2:</strong> " +
        Number(point.y).toFixed(4) + "<br>" +
        "<strong>Dimension 3:</strong> " +
        Number(point.z).toFixed(4) +
        "</p>";
    });

    spaceSelector.addEventListener(
      "change",
      updateGraph
    );

    groupSelector.addEventListener(
      "change",
      updateGraph
    );

    markerSize.addEventListener(
      "input",
      updateGraph
    );

    document.getElementById("resetButton")
      .addEventListener("click", () => {
        currentCamera = null;

        Plotly.relayout(graph, {
          "scene.camera": {
            eye: {
              x: 1.25,
              y: 1.25,
              z: 1.25
            },
            center: {
              x: 0,
              y: 0,
              z: 0
            },
            up: {
              x: 0,
              y: 0,
              z: 1
            }
          }
        });
      });
  </script>

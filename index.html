<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>AR Scatter3D Demo</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
  <a-scene embedded arjs>

    <!-- Marker QR -->
    <a-marker preset="hiro">
      <a-entity id="scatter"></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    fetch('scatter_data.json')
      .then(r => r.json())
      .then(data => {
        const scatter = document.getElementById('scatter');

        data.forEach(p => {
          const sphere = document.createElement('a-sphere');
          sphere.setAttribute('radius', 0.03);
          sphere.setAttribute('position', `${p.x} ${p.y} ${p.z}`);

          const colors = ['red', 'green', 'blue'];
          sphere.setAttribute('color', colors[p.cluster]);

          scatter.appendChild(sphere);
        });
      });
  </script>
</body>
</html>

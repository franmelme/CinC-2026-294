const COLORS={"0":"#0072BD","1":"#D95319"};
const NAMES={"0":"Pre Injection","1":"Post Injection"};
const ALL="__ALL__";
const spaceSelector=document.getElementById("spaceSelector");
const groupSelector=document.getElementById("groupSelector");
const markerSize=document.getElementById("markerSize");
const resetButton=document.getElementById("resetButton");
const graph=document.getElementById("graph");
const status=document.getElementById("status");
const information=document.getElementById("information");
let currentCamera=null;
let eventsInstalled=false;
const norm=v=>String(v).trim();
const currentSpace=()=>data.espacios[Number(spaceSelector.value)];
const groupsIn=s=>[...new Set(s.etiquetas.map(norm))].sort();
function prepareSpaces(){spaceSelector.innerHTML="";data.nombres.forEach((n,i)=>{const o=document.createElement("option");o.value=String(i);o.textContent=n;spaceSelector.appendChild(o);});spaceSelector.value="0";}
function updateGroups(){const previous=groupSelector.value;const gs=groupsIn(currentSpace());groupSelector.innerHTML="";const a=document.createElement("option");a.value=ALL;a.textContent="All groups";groupSelector.appendChild(a);gs.forEach(g=>{const o=document.createElement("option");o.value=g;o.textContent=NAMES[g]||("Group "+g);groupSelector.appendChild(o);});groupSelector.value=gs.includes(previous)?previous:ALL;}
function createTraces(){const s=currentSpace();const labs=s.etiquetas.map(norm);const selected=groupSelector.value;const traces=[];groupsIn(s).forEach(g=>{if(selected!==ALL&&selected!==g)return;const idx=[];labs.forEach((v,i)=>{if(v===g)idx.push(i);});if(idx.length===0)return;traces.push({type:"scatter3d",mode:"markers",name:NAMES[g]||("Group "+g),x:idx.map(i=>s.x[i]),y:idx.map(i=>s.y[i]),z:idx.map(i=>s.z[i]),customdata:idx.map(i=>[s.indices[i],s.identificadores[i],labs[i]]),marker:{size:Number(markerSize.value),color:COLORS[g]||"#808080",opacity:.88,line:{color:"#fff",width:.35}},hovertemplate:"<b>%{customdata[1]}</b><br>Group: %{customdata[2]}<br>X: %{x:.3f}<br>Y: %{y:.3f}<br>Z: %{z:.3f}<extra></extra>"});});return traces;}
function installGraphEvents(){if(eventsInstalled)return;graph.on("plotly_relayout",e=>{if(e["scene.camera"])currentCamera=e["scene.camera"];});graph.on("plotly_click",e=>{if(!e.points||!e.points.length)return;const p=e.points[0],m=p.customdata;information.innerHTML="<p><strong>Observation:</strong> "+m[1]+"<br><strong>Group:</strong> "+m[2]+"<br><strong>X:</strong> "+Number(p.x).toFixed(4)+"<br><strong>Y:</strong> "+Number(p.y).toFixed(4)+"<br><strong>Z:</strong> "+Number(p.z).toFixed(4)+"</p>";});eventsInstalled=true;}
function updateGraph(){const s=currentSpace();const traces=createTraces();const layout={title:{text:data.nombres[Number(spaceSelector.value)],x:.5},margin:{l:0,r:0,b:0,t:45},uirevision:"camera",scene:{aspectmode:"data",xaxis:{title:"Dimension 1"},yaxis:{title:"Dimension 2"},zaxis:{title:"Dimension 3"}}};if(currentCamera)layout.scene.camera=currentCamera;return Plotly.react(graph,traces,layout,{responsive:true,displaylogo:false,scrollZoom:true}).then(()=>{installGraphEvents();const n=traces.reduce((a,t)=>a+t.x.length,0);status.textContent=groupsIn(s).length+" groups detected. "+n+" points displayed.";});}
function init(){if(typeof Plotly==="undefined"){status.className="error";status.textContent="Plotly could not be loaded.";return;}prepareSpaces();updateGroups();updateGraph().catch(e=>{console.error(e);status.className="error";status.textContent=e.message;});}
